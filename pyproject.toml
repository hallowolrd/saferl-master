[project]
name = "hfg-srl"
version = "0.1.0"
description = "Hierarchical Fuzzy-Guided Safe Reinforcement Learning for Microgrid Optimal Dispatch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yang Aihui", email = "yangaihui@example.com"},
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "gymnasium>=0.28",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hfg_srl*"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
